# Publishes the 3D model (docs/model) with the app built into it to GitHub Pages:
# https://mr-sushi.github.io/fretcase/
# Pages must be switched on once in the repository: Settings → Pages → Source: GitHub Actions.
name: 3D model on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/model/**', 'app/**', 'shared/**', '.github/workflows/model-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: docs/model/build-device.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/model
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
