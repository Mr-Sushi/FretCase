[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fretcase"
version = "0.1.0"
description = "FretCase engine and server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "websockets>=12",
  "jsonschema>=4.20",
  "rfc3339-validator",
  "numpy",
  "pillow>=10",
  "fretcase-device",
]

[project.optional-dependencies]
hum = ["basic-pitch>=0.4", "onnxruntime", "librosa", "scipy", "resampy", "pretty_midi", "mir_eval", "setuptools<81"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "datamodel-code-generator>=0.25", "pillow>=10"]

[tool.pytest.ini_options]
pythonpath = ["engine", "server"]
testpaths = ["engine/tests", "server/tests"]

[tool.uv.sources]
# The card module (fretcase_card) lives in the device package; the server imports it.
fretcase-device = { path = "device", editable = true }

[tool.uv]
# basic-pitch lists tensorflow as a dependency, which has no wheel for Python 3.13.
# We run its bundled ONNX model with onnxruntime instead, so tensorflow is excluded.
override-dependencies = ["tensorflow; sys_platform == 'never'", "tensorflow-macos; sys_platform == 'never'", "tflite-runtime; sys_platform == 'never'", "coremltools; sys_platform == 'never'"]

[tool.hatch.build.targets.wheel]
include = ["engine/fretcase_engine", "server/fretcase_server"]
sources = ["engine", "server"]
