<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FretCase 结构模型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* layout: 3D stage fills the left, a narrow spec column sits on the right; stacks on phones */
  --bg: #e6ebee;
  --surface: #f6f8f9;
  --ink: #14232b;
  --muted: #55676f;
  --line: #c9d3d8;
  --accent: #0d6b6e;
  --accent-ink: #ffffff;
  --warm: #b86a12;
  --font-display: "Bricolage Grotesque", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-body: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f191e;
    --surface: #15232a;
    --ink: #e5edf0;
    --muted: #92a6ae;
    --line: #293a43;
    --accent: #4dbab5;
    --accent-ink: #05201f;
    --warm: #e3a14a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f191e;
  --surface: #15232a;
  --ink: #e5edf0;
  --muted: #92a6ae;
  --line: #293a43;
  --accent: #4dbab5;
  --accent-ink: #05201f;
  --warm: #e3a14a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
}
.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
}
.stage {
  position: relative;
  min-height: 0;
  overflow: hidden;
}
#c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#c:active { cursor: grabbing; }
#markers { position: absolute; inset: 0; pointer-events: none; }
.marker {
  position: absolute;
  width: 22px; height: 22px;
  margin: -11px 0 0 -11px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-ink);
  font: 500 11px/22px var(--font-mono);
  text-align: center;
  box-shadow: 0 0 0 2px var(--bg);
  transition: opacity .2s, transform .2s;
}
.marker.back { opacity: .28; }
.marker.hot { transform: scale(1.45); background: var(--warm); }
.views {
  position: absolute; left: 16px; top: 16px;
  display: flex; flex-wrap: wrap; gap: 6px;
}
.views button, .seg label {
  font: 500 13px/1 var(--font-body);
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px 12px;
  cursor: pointer;
}
.views button:hover, .seg label:hover { border-color: var(--accent); }
.views button:focus-visible, .seg input:focus-visible + label, input[type="range"]:focus-visible, .legend button:focus-visible, .toggles input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.hint {
  position: absolute; left: 16px; bottom: 12px; margin: 0;
  color: var(--muted); font-size: 12px;
}
.panel {
  background: var(--surface);
  border-left: 1px solid var(--line);
  overflow-y: auto;
  padding: 22px 20px 28px;
  display: flex; flex-direction: column; gap: 22px;
}
h1 {
  font: 700 30px/1.05 var(--font-display);
  letter-spacing: -0.02em;
  margin: 0 0 6px;
  text-wrap: balance;
}
.sub { margin: 0; color: var(--muted); }
h2 {
  font: 600 12px/1.2 var(--font-body);
  letter-spacing: .08em;
  color: var(--muted);
  margin: 0 0 10px;
}
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 10px 6px; }
.seg input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.spec { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
.spec dt { color: var(--muted); }
.spec dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.note { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
.lidrow { display: flex; align-items: center; gap: 12px; }
.lidrow input { flex: 1; accent-color: var(--accent); }
.lidrow output { font-family: var(--font-mono); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
.toggles { display: flex; flex-direction: column; gap: 8px; }
.toggles label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.toggles input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.legend button {
  width: 100%;
  display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start;
  text-align: left;
  background: none; border: 0; border-top: 1px solid var(--line);
  padding: 9px 0; color: inherit; font: inherit; cursor: pointer;
}
.legend li:first-child button { border-top: 0; }
.legend .n {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  font: 500 11px/22px var(--font-mono); text-align: center;
}
.legend .t { font-weight: 600; }
.legend .d { display: block; color: var(--muted); font-size: 13px; }
.foot { color: var(--muted); font-size: 12px; margin: 0; }
@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); }
  .stage { height: min(86vw + 60px, 520px); }
  .panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; padding: 20px 16px 28px; }
}
@media (prefers-reduced-motion: reduce) { .marker { transition: none; } }
</style>
</head>
<body>
<main class="app">
  <section class="stage" id="stage" aria-label="FretCase 三维模型">
    <canvas id="c"></canvas>
    <div id="markers" aria-hidden="true"></div>
    <div class="views" role="group" aria-label="视角">
      <button type="button" data-view="front">正面</button>
      <button type="button" data-view="top">俯视控件</button>
      <button type="button" data-view="back">背面镜头</button>
      <button type="button" data-view="side">侧面</button>
    </div>
    <p class="hint">拖动旋转，滚轮或双指缩放</p>
  </section>
  <aside class="panel">
    <header>
      <h1>FretCase</h1>
      <p class="sub">打开就能写歌的复古皮箱。面板上是唱盘、四个旋钮、四个功能键、六路小调音台，以及卡片仓和卡片架，单位是毫米。</p>
    </header>
    <section>
      <h2>箱盖里的屏幕</h2>
      <div class="seg" role="radiogroup" aria-label="屏幕选项">
        <input type="radio" name="screen" id="s-pi7" value="pi7"><label for="s-pi7">7 寸触摸屏</label>
        <input type="radio" name="screen" id="s-mini" value="mini"><label for="s-mini">iPad mini</label>
        <input type="radio" name="screen" id="s-ipad11" value="ipad11" checked><label for="s-ipad11">iPad 11 寸</label>
        <input type="radio" name="screen" id="s-pro13" value="pro13"><label for="s-pro13">iPad Pro 13 寸</label>
      </div>
      <dl class="spec">
        <dt>机身外形</dt><dd id="sp-body"></dd>
        <dt>显示区域</dt><dd id="sp-disp"></dd>
        <dt>相对 7 寸屏</dt><dd id="sp-ratio"></dd>
        <dt>占箱盖内宽</dt><dd id="sp-fit"></dd>
      </dl>
      <p class="note" id="sp-note"></p>
    </section>
    <section>
      <h2>箱盖开合</h2>
      <div class="lidrow">
        <input type="range" id="lid" min="0" max="115" step="1" value="100" aria-label="箱盖角度">
        <output id="lid-out" for="lid">100°</output>
      </div>
    </section>
    <section class="toggles">
      <label for="tg-labels"><input type="checkbox" id="tg-labels" checked> 显示部件编号</label>
      <label for="tg-inside"><input type="checkbox" id="tg-inside"> 透视箱底夹层（主机、电池、控制板）</label>
    </section>
    <section>
      <h2>部件</h2>
      <ol class="legend" id="legend"></ol>
    </section>
    <p class="foot">箱体按 320 × 240 × 100 毫米（合箱）建模，这是为了放下 11 寸平板和控制面板而取的假设值。iPad 11 寸和 iPad Pro 13 寸的尺寸来自 Apple 规格页，iPad mini 和 7 寸屏是近似值。</p>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  'use strict';
  var T = window.THREE;
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('c');
  if (!T) { stage.insertAdjacentHTML('beforeend', '<p class="hint" style="top:64px;bottom:auto">三维库没有加载成功，请检查网络后刷新。</p>'); return; }

  // ---- dimensions (mm) ----
  var W = 320, D = 240, HB = 72, HL = 28, WALL = 4, R = 18, RIM = 6, PY = HB - 22;
  var PW = W - 2 * WALL, PD = D - 2 * WALL;
  var SCREENS = {
    pi7:    { name: '7 寸触摸屏',     w: 190,   h: 120,   t: 9,   dw: 155,   dh: 87,    tablet: false, approx: true },
    mini:   { name: 'iPad mini',      w: 195.4, h: 134.8, t: 6.3, dw: 176.2, dh: 115.7, tablet: true,  approx: true },
    ipad11: { name: 'iPad 11 寸',     w: 248.6, h: 179.5, t: 7.0, dw: 226.5, dh: 157.4, tablet: true,  approx: false },
    pro13:  { name: 'iPad Pro 13 寸', w: 281.6, h: 215.5, t: 5.1, dw: 264.2, dh: 198.1, tablet: true,  approx: false }
  };
  var TRACKS = [
    { n: '人声', c: '#e2725b' }, { n: '旋律', c: '#e3a14a' }, { n: '吉他', c: '#49b8b3' },
    { n: '贝斯', c: '#5b8dd6' }, { n: '鼓', c: '#9a7bd1' }, { n: '环境', c: '#7fae6a' }
  ];
  var KNOB_X = [20, 56, 92, 128];
  var TRACK_X = [17, 39.8, 62.6, 85.4, 108.2, 131];
  var SCALE_X = [16.5, 35.67, 54.83, 74, 93.17, 112.33, 131.5];
  var ACT_X = [-131, -99.67, -68.33, -37];
  var CHORDS = ['D', 'D', 'Bm', 'Bm', 'G', 'G', 'A', 'A', 'D', 'F#m', 'G', 'A', 'Em', 'G', 'A', 'D'];
  var CJK = '"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif';

  // ---- renderer, scene, camera ----
  var renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  var scene = new T.Scene();
  var camera = new T.PerspectiveCamera(30, 1, 10, 6000);
  var controls = new T.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 320;
  controls.maxDistance = 1900;
  controls.maxPolarAngle = Math.PI * 0.497;
  controls.enablePan = false;

  scene.add(new T.HemisphereLight(0xffffff, 0x8a8f96, 0.78));
  var sun = new T.DirectionalLight(0xffffff, 0.62);
  sun.position.set(260, 620, 420);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -520; sun.shadow.camera.right = 520;
  sun.shadow.camera.top = 520; sun.shadow.camera.bottom = -520;
  sun.shadow.camera.near = 100; sun.shadow.camera.far = 1600;
  sun.shadow.bias = -0.0006;
  scene.add(sun);
  var fill = new T.DirectionalLight(0xffffff, 0.22);
  fill.position.set(-400, 300, -500);
  scene.add(fill);

  var ground = new T.Mesh(new T.CircleGeometry(1400, 48), new T.ShadowMaterial({ opacity: 0.2 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---- helpers ----
  function std(color, rough, metal, extra) {
    var m = new T.MeshStandardMaterial({ color: color, roughness: rough == null ? 0.7 : rough, metalness: metal || 0 });
    if (extra) { for (var k in extra) { m[k] = extra[k]; } }
    return m;
  }
  function rr(w, d, r, ctx) {
    var s = ctx || new T.Shape();
    var x = -w / 2, y = -d / 2;
    s.moveTo(x + r, y);
    s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
    s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  function slab(w, d, r, h, mat) {
    var g = new T.ExtrudeGeometry(rr(w, d, r), { depth: h, bevelEnabled: false, curveSegments: 10 });
    g.rotateX(-Math.PI / 2);
    return new T.Mesh(g, mat);
  }
  function ring(w, d, r, wall, h, mat) {
    var s = rr(w, d, r);
    s.holes.push(rr(w - 2 * wall, d - 2 * wall, Math.max(r - wall, 1), new T.Path()));
    var g = new T.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: 10 });
    g.rotateX(-Math.PI / 2);
    return new T.Mesh(g, mat);
  }
  function box(w, h, d, mat, x, y, z) {
    var m = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
    m.position.set(x || 0, y || 0, z || 0);
    return m;
  }
  function cyl(r, h, mat, x, y, z, seg) {
    var m = new T.Mesh(new T.CylinderGeometry(r, r, h, seg || 32), mat);
    m.position.set(x || 0, y || 0, z || 0);
    return m;
  }
  function tex(cv) {
    var t = new T.CanvasTexture(cv);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  // ---- materials ----
  function grain() {
    var cv = document.createElement('canvas'); cv.width = cv.height = 256;
    var c = cv.getContext('2d');
    c.fillStyle = '#808080'; c.fillRect(0, 0, 256, 256);
    for (var i = 0; i < 2600; i++) {
      c.fillStyle = Math.random() < 0.5 ? 'rgba(40,40,40,0.35)' : 'rgba(215,215,215,0.3)';
      c.beginPath(); c.arc(Math.random() * 256, Math.random() * 256, 0.6 + Math.random() * 1.6, 0, 7); c.fill();
    }
    var t = new T.CanvasTexture(cv);
    t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(0.03, 0.03);
    return t;
  }
  var mShell = std(0x8c5731, 0.82, 0, { bumpMap: grain(), bumpScale: 0.55 });
  var mShellDark = std(0x5e3a20, 0.85, 0);
  var mTrim = std(0x4a2c18, 0.8, 0);
  var mMetal = std(0xc9a654, 0.36, 0.3);
  var mLeather = std(0x4f2f1a, 0.7, 0);
  var mPanel = std(0x5b3b24, 0.6, 0, { transparent: true, opacity: 1 });
  var mFelt = std(0x1f3d34, 0.98, 0);
  var mCream = std(0xf1e9d6, 0.5, 0);
  var mLit = std(0xffc463, 0.4, 0, { emissive: new T.Color(0xe08a12), emissiveIntensity: 0.8 });
  var mDark = std(0x1b1e22, 0.5, 0.1);
  var mKnob = std(0x2a211c, 0.4, 0.15);
  var mCopper = std(0xd0915a, 0.4, 0.3);
  var mGlass = std(0x0c0f12, 0.15, 0.3);

  var root = new T.Group();
  root.position.y = 4;
  scene.add(root);

  // ---- base ----
  var base = new T.Group();
  root.add(base);
  base.add(slab(W, D, R, WALL, mShell));
  var baseWalls = ring(W, D, R, WALL, HB - WALL, mShell);
  baseWalls.position.y = WALL;
  base.add(baseWalls);
  var baseTrim = ring(W + 2, D + 2, R + 1, 2.5, 4, mTrim);
  baseTrim.position.y = HB - 3.8;
  base.add(baseTrim);
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (p) {
    base.add(cyl(8, 4, mMetal, p[0] * (W / 2 - 30), -2, p[1] * (D / 2 - 30)));
  });

  var panel = slab(PW, PD, R - WALL, 2, mPanel);
  panel.position.y = PY - 2;
  base.add(panel);

  // walnut veneer on the panel face
  var wood = document.createElement('canvas');
  wood.width = PW * 3; wood.height = PD * 3;
  (function () {
    var c = wood.getContext('2d'), w = wood.width, h = wood.height;
    c.fillStyle = '#6b4427'; c.fillRect(0, 0, w, h);
    for (var i = 0; i < 300; i++) {
      var y = Math.random() * h, amp = 2 + Math.random() * 7, ph = Math.random() * 6, f = 0.004 + Math.random() * 0.006;
      c.strokeStyle = Math.random() < 0.7 ? 'rgba(38,20,8,' + (0.06 + Math.random() * 0.16) + ')' : 'rgba(205,150,95,' + (0.05 + Math.random() * 0.08) + ')';
      c.lineWidth = 0.6 + Math.random() * 2.4;
      c.beginPath();
      for (var x = 0; x <= w; x += 24) { var yy = y + Math.sin(x * f + ph) * amp; if (x === 0) { c.moveTo(x, yy); } else { c.lineTo(x, yy); } }
      c.stroke();
    }
  })();
  var woodMat = new T.MeshStandardMaterial({ map: tex(wood), roughness: 0.55, transparent: true });
  var woodPlane = new T.Mesh(new T.PlaneGeometry(PW, PD), woodMat);
  woodPlane.rotation.x = -Math.PI / 2;
  woodPlane.position.y = PY + 0.04;
  base.add(woodPlane);

  // lettering on the panel
  var S = 6;
  var silk = document.createElement('canvas');
  silk.width = PW * S; silk.height = PD * S;
  (function () {
    var c = silk.getContext('2d');
    function at(x, z) { return [(x + PW / 2) * S, (z + PD / 2) * S]; }
    function label(str, x, z, mm, align, weight) {
      var p = at(x, z);
      c.font = (weight || 500) + ' ' + (mm * S) + 'px ' + CJK;
      c.textAlign = align || 'center';
      c.textBaseline = 'middle';
      c.fillText(str, p[0], p[1]);
    }
    c.fillStyle = '#f3e6c8';
    label('FretCase', -141, -101, 6.2, 'left', 700);
    ['明暗', '简繁', '疏密', '速度'].forEach(function (s, i) { label(s, KNOB_X[i], -50, 4.6, 'center', 600); });
    TRACKS.forEach(function (t, i) { label(t.n, TRACK_X[i], 51, 4.6, 'center', 600); });
    label('卡片仓', 15, 73, 4.4, 'center', 600);
    label('卡片架', 30, 102, 4.4, 'center', 600);
    ['采集', '播放', '撤销', '换一个'].forEach(function (s, i) { label(s, ACT_X[i], 95, 4.6, 'center', 600); });
  })();
  var silkPlane = new T.Mesh(new T.PlaneGeometry(PW, PD), new T.MeshBasicMaterial({ map: tex(silk), transparent: true }));
  silkPlane.rotation.x = -Math.PI / 2;
  silkPlane.position.y = PY + 0.08;
  base.add(silkPlane);

  // left: jog platter with a light ring, a song disc on it
  var PX = -84, PZ = -25;
  base.add(cyl(51.5, 3, mMetal, PX, PY + 1.5, PZ, 64));
  base.add(cyl(49, 6, mDark, PX, PY + 3, PZ, 64));
  base.add(cyl(35, 1.4, mCream, PX, PY + 6.7, PZ, 48));
  base.add(cyl(12, 1.5, mFelt, PX, PY + 6.8, PZ, 32));
  base.add(cyl(1.8, 5, mMetal, PX, PY + 8, PZ, 16));
  base.add(cyl(5, 1.2, mMetal, PX + 42, PY + 6.2, PZ, 24));
  for (var i = 0; i < 16; i++) {
    var th = i / 16 * Math.PI * 2, here = i === 5;
    var lm = std(here ? 0xffc463 : 0xf1e9d6, 0.4, 0, {
      emissive: new T.Color(here ? 0xe08a12 : 0x8a7a5a), emissiveIntensity: here ? 0.95 : 0.18
    });
    base.add(cyl(2.3, 2.2, lm, PX + 57 * Math.sin(th), PY + 1.1, PZ - 57 * Math.cos(th), 12));
  }
  function roundKey(x, z, r, capMat) {
    base.add(cyl(r + 1.6, 4.5, mMetal, x, PY + 2.25, z, 36));
    base.add(cyl(r, 7.5, capMat, x, PY + 3.75, z, 36));

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h || (w === vw && h === vh)) { return; }
    vw = w; vh = h;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w < 560 ? 40 : 30;
    camera.updateProjectionMatrix();
  }
  var v3 = new T.Vector3(), c3 = new T.Vector3(), caster = new T.Raycaster();
  function ease(k) { return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }
  function frame() {
    resize();
    if (Math.abs(lidNow - lidTarget) > 0.05) { lidNow += (lidTarget - lidNow) * 0.16; } else { lidNow = lidTarget; }
    lid.rotation.x = -lidNow * Math.PI / 180;
    if (fly) {
      fly.k = Math.min(1, fly.k + 0.035);
      var e = ease(fly.k);
      camera.position.lerpVectors(fly.p0, fly.p1, e);
      controls.target.lerpVectors(fly.t0, fly.t1, e);
      if (fly.k >= 1) { fly = null; }
    }
    controls.update();
    renderer.render(scene, camera);
    if (tgLabels.checked) {
      for (var i = 0; i < PARTS.length; i++) {
        var p = PARTS[i];
        p.a.getWorldPosition(v3);
        c3.copy(v3).sub(camera.position);
        var dist = c3.length();
        caster.set(camera.position, c3.normalize());
        caster.far = Math.max(dist - 7, 1);
        var facing = caster.intersectObject(root, true).length === 0;
        v3.project(camera);
        var show = v3.z < 1 && v3.z > -1;
        p.el.style.display = show ? '' : 'none';
        p.el.style.left = ((v3.x * 0.5 + 0.5) * vw) + 'px';
        p.el.style.top = ((-v3.y * 0.5 + 0.5) * vh) + 'px';
        p.el.classList.toggle('back', !facing);
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
