[project]
name = "fretcase-device"
version = "0.1.0"
description = "FretCase device side: panel bridge and card module"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3",
    "websockets>=14",
    "jsonschema>=4.20",
    "pillow>=10",
    "numpy>=1.26",
    "qrcode>=7.4",
    "python-escpos>=3.1",
    "opencv-python-headless>=4.8",
    "bleak>=0.22",
    "pyusb>=1.2",
]

[project.optional-dependencies]
# Needs the ALSA development headers (libasound2-dev) to build, so it is not
# installed by default. The Pi image installs it; the tests do not need it.
midi = ["python-rtmidi>=1.5"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
fretcase-bridge = "fretcase_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge/fretcase_bridge", "card/fretcase_card"]

[tool.pytest.ini_options]
testpaths = ["bridge/tests", "card/tests", "simulator/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
